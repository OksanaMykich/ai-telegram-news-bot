services:
  postgres:
    image: postgres:18
    container_name: aibot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aibot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: aibot-redis-compose
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: aibot-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - telegram_sessions:/app/sessions

  worker:
    build: .
    container_name: aibot-worker
    command: celery -A celery_worker.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    volumes:
      - telegram_sessions:/app/sessions

  beat:
    build: .
    container_name: aibot-beat
    command: celery -A celery_worker.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    volumes:
      - telegram_sessions:/app/sessions

volumes:
  postgres_data:
  telegram_sessions: